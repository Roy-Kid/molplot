name: release-core

# A `v*` tag: build @molcrafts/molplot and publish it to npm. A manual run
# builds without publishing anything. The npm Trusted Publisher names this
# file and the `release-core` environment.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release-core
    permissions:
      contents: read
      actions: read  # to read the tagged commit's ci run
      id-token: write  # npm trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # to see whether the tag is on master
          persist-credentials: false
      - uses: MolCrafts/molcrafts-ci/actions/setup-molci@master

      # Node 24 ships npm 11.5+, the minimum for OIDC Trusted Publishing's
      # registry-side handshake (Node 22's bundled npm 10.9 cannot complete it).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # On a tag: the tag is core's version, is on master, and its commit
      # passed ci. A manual run is a dry run and skips this.
      - name: Ready to release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: molci release-ready --version "$(node -p "require('./core/package.json').version")"

      - run: npm ci --no-audit --no-fund
      - run: npm run build:core

      # Idempotent: the 0.1.0 bootstrap was published from the CLI to create
      # the package before a Trusted Publisher could be configured for it.
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v') && github.repository_owner == 'MolCrafts'
        run: |
          VERSION=$(node -p "require('./core/package.json').version")
          PUBLISHED=$(npm view "@molcrafts/molplot@${VERSION}" version 2>/dev/null || true)
          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "@molcrafts/molplot@${VERSION} already published — skipping."
          else
            npm publish -w core --provenance --access public
          fi
