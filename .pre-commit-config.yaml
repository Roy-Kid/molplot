# Managed by prek: `prek install`
# The checks of .github/ci.toml, by stage: `pre-commit` ones on every commit,
# `pre-push` ones before a push. CI runs all of them.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: molci-pre-commit
        name: molci check --stage pre-commit
        entry: uvx --from git+https://github.com/MolCrafts/molcrafts-ci@master molci check --stage pre-commit
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: molci-pre-push
        name: molci check --stage pre-push
        entry: uvx --from git+https://github.com/MolCrafts/molcrafts-ci@master molci check --stage pre-push
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
